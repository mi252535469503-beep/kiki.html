    <style>
        body {

            color: white; 
            display: flex;

            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .loader {
            border: 6px solid #333;
            border-top: 6px solid #00aaff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { 
            padding: 15px 35px; 
            background: #00aaff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.3);
        }
        video, canvas { display: none; }
        #status { margin-top: 15px; color: #888; font-size: 14px; }
    </style>
</head>
